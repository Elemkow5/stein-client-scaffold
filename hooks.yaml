# hooks.yaml — Canonical Connective Tissue Spec
#
# Source of truth for all hooks. Never edit .claude/settings.json directly.
# Run: python3 System/Scripts/generate-claude-settings.py to regenerate settings.json
#
# LLM portability: the 'llm_note' field names the Claude Code event.
# To swap LLMs: write an adapter that reads this file and registers hooks
# in the target runtime's format. The scripts themselves don't change.

hooks:
  - trigger: UserPromptSubmit
    script: .claude/hooks/session-start.sh
    purpose: Pre-load context, inject identity file, check for pending messages
    context_passed: [session_file, identity_file, vault_root]
    llm_note: Claude Code UserPromptSubmit event

  - trigger: UserPromptSubmit
    script: .claude/hooks/prompt-submit.sh
    purpose: Session log gap reminder — fires if last logged entry is > 30 min old
    context_passed: [session_file]
    llm_note: Claude Code UserPromptSubmit event

  - trigger: PostToolUse
    tool: Write
    script: .claude/hooks/post-write.sh
    purpose: Wikilink check on file writes — scan for named entities, prompt to link
    context_passed: [file_path, file_content]
    llm_note: Claude Code PostToolUse event, tool_name = Write

  - trigger: PreToolUse
    tool: Read
    script: .claude/hooks/context-injector.cjs
    purpose: Dex-style context injection — match .md reads against project index, inject context tags
    context_passed: [file_path]
    llm_note: Claude Code PreToolUse event, tool_name = Read
